<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Välj Form — ELEGANT-M</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Josefin+Sans:wght@200;300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      background:linear-gradient(160deg,#8e9eab 0%,#606c76 30%,#4a5560 60%,#2c3e50 100%);
      min-height:100vh;
      font-family:'Josefin Sans',sans-serif;
      overflow-x:hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* Samma glitter-effekt som i sten.html */
    body::before{
      content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background-image:radial-gradient(circle,rgba(255,255,255,0.4) 0.5px,transparent 0.5px),radial-gradient(circle,rgba(200,200,200,0.3) 0.3px,transparent 0.3px),radial-gradient(circle,rgba(255,255,255,0.3) 0.4px,transparent 0.4px);
      background-size:28px 28px,18px 22px,40px 32px;background-position:0 0,7px 9px,15px 5px;
      animation:glitterShift 6s ease-in-out infinite alternate;
    }
    @keyframes glitterShift{0%{opacity:0.4}50%{opacity:0.9}100%{opacity:0.45}}

    .top-bar{position:relative;z-index:10;width:100%;max-width:1200px;margin:0 auto;padding:1.8rem 2.5rem 0;display:flex;align-items:center;justify-content:space-between;}
    .back-link{font-size:0.72rem;letter-spacing:0.25em;text-transform:uppercase;text-decoration:none;color:#111;opacity:0.65;display:flex;align-items:center;gap:0.5rem;transition:opacity 0.2s;}
    .back-link:hover{opacity:1;}
    .back-link::before{content:'←';font-size:1rem;}
    .site-name{font-family:'Cormorant Garamond',serif;font-size:clamp(1.3rem,2.5vw,1.9rem);font-weight:300;letter-spacing:0.18em;background:linear-gradient(135deg,#111 0%,#2a2a2a 50%,#111 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;white-space:nowrap;}
    .site-name span{font-style:italic;}
    .top-spacer{width:100px;}

    .page-title{position:relative;z-index:10;text-align:center;padding:4rem 1rem 2rem;}
    .page-title h1{font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,8vw,6rem);font-weight:300;letter-spacing:0.15em;background:linear-gradient(135deg,#111 0%,#333 50%,#111 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .page-title p{font-size:clamp(0.7rem,1.3vw,0.85rem);letter-spacing:0.28em;text-transform:uppercase;color:#111;opacity:0.55;margin-top:0.5rem;}

    .shape-grid{position:relative;z-index:10;width:min(1200px,95vw);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2.5rem;padding:2rem 0 5rem;}
    
    .shape-card{
      background:radial-gradient(circle at 40% 30%, #2c3e50 0%, #1a252f 100%);
      border:0.5px solid rgba(255,255,255,0.3);
      border-radius:24px;
      padding:2.5rem 2rem;
      text-align:center;
      text-decoration:none;
      transition:transform 0.3s, box-shadow 0.3s, border-color 0.3s;
      display:flex;
      flex-direction:column;
      align-items:center;
      cursor:pointer;
    }
    .shape-card:hover{
      transform:translateY(-10px);
      border-color:rgba(255,255,255,0.7);
      box-shadow:0 20px 40px rgba(0,0,0,0.4);
    }
    .shape-img-wrap{
      width:150px;
      height:150px;
      margin-bottom:1.5rem;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .shape-img-wrap img{
      width:100%;
      height:100%;
      object-fit:contain;
      filter:drop-shadow(0 10px 20px rgba(0,0,0,0.5));
    }
    .shape-name{
      font-family:'Cormorant Garamond',serif;
      font-size:1.8rem;
      color:#eee;
      margin-bottom:1.5rem;
      letter-spacing:0.1em;
    }
    .select-btn{
      font-family:'Josefin Sans',sans-serif;
      font-size:0.65rem;
      letter-spacing:0.2em;
      text-transform:uppercase;
      padding:0.7rem 1.8rem;
      border:0.5px solid rgba(255,255,255,0.4);
      border-radius:20px;
      background:transparent;
      color:#ddd;
      cursor:pointer;
      transition:all 0.3s;
    }
    .shape-card:hover .select-btn{
      background:#fff;
      color:#1a252f;
      border-color:#fff;
    }

    .mini-footer{position:relative;z-index:10;width:100%;border-top:0.5px solid rgba(0,0,0,0.2);padding:1rem 0;margin-top:auto;}
    .mini-footer-inner{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:center;width:100%;max-width:1200px;margin:0 auto;padding:0 2rem;gap:1rem;}
    .mini-footer-links{display:flex;gap:0;align-items:center;}
    .mini-footer-links a{font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;color:#111;opacity:0.6;padding:0 0.7rem;border-right:1px solid rgba(0,0,0,0.2);line-height:1;transition:opacity 0.2s;}
    .mini-footer-links a:first-child{padding-left:0;}
    .mini-footer-links a:last-child{border-right:none;}
    .mini-footer-links a:hover{opacity:1;}
    .mini-footer-mid{font-size:0.62rem;letter-spacing:0.12em;text-transform:uppercase;color:#111;opacity:0.6;}
    .mini-footer-copy{font-size:0.62rem;letter-spacing:0.08em;color:#111;opacity:0.6;text-align:right;}

    @media(max-width:600px){
      .top-bar{padding:1.2rem 1.2rem 0;}
      .site-name{font-size:1rem;}
      .top-spacer{width:50px;}
      .shape-grid{grid-template-columns:1fr;}
      .mini-footer-inner{flex-direction:column;align-items:center;gap:0.6rem;text-align:center;}
    }
  </style>
</head>
<body>

<div class="top-bar">
  <a class="back-link" href="sten.html">Tillbaka</a>
  <a class="site-name" href="index.html">ELEGANT<span>-M</span></a>
  <div class="top-spacer"></div>
</div>

<div class="page-title">
  <h1>Välj Form</h1>
  <p>Glasunderlägg i natursten — välj din perfekta form</p>
</div>

<div class="shape-grid">
  <!-- Hjärta -->
  <a class="shape-card" href="bestall-sten-hjarta.html">
    <div class="shape-img-wrap"><img src="hjarta.png" alt="Hjärtformad stenplatta"></div>
    <div class="shape-name">Hjärtform</div>
    <div class="select-btn">Välj form</div>
  </a>

  <!-- Rond -->
  <a class="shape-card" href="bestall-sten-rond.html">
    <div class="shape-img-wrap"><img src="rond.png" alt="Rund stenplatta"></div>
    <div class="shape-name">Rond</div>
    <div class="select-btn">Välj form</div>
  </a>

  <!-- Fyrkant -->
  <a class="shape-card" href="bestall-sten-fyrkant.html">
    <div class="shape-img-wrap"><img src="fyrkant.png" alt="Fyrkantig stenplatta"></div>
    <div class="shape-name">Fyrkant</div>
    <div class="select-btn">Välj form</div>
  </a>

  <!-- Hexagon -->
  <a class="shape-card" href="bestall-sten-hexagon.html">
    <div class="shape-img-wrap"><img src="hexagon.png" alt="Hexagon stenplatta"></div>
    <div class="shape-name">Hexagon</div>
    <div class="select-btn">Välj form</div>
  </a>
</div>

<div class="mini-footer">
  <div class="mini-footer-inner">
    <div class="mini-footer-links">
      <a href="index.html">Köpvillkor</a>
      <a href="kontakt.html">Kontakt</a>
    </div>
    <div class="mini-footer-mid">Sverige &ndash; SEK</div>
    <div class="mini-footer-copy">&copy; ALKAISY AB 559285-0588</div>
  </div>
</div>

</body>
</html>
