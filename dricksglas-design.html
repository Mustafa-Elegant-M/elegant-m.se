<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Designa Ditt Glas — ELEGANT-M</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Great+Vibes&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: linear-gradient(160deg, #f4f5f7, #aeb4ba); min-height: 100vh; font-family: 'Josefin Sans', sans-serif; color: #111; padding: 2rem; }
    .wrapper { max-width: 1100px; margin: 2rem auto; display: flex; gap: 3rem; }
    .preview-side { flex: 1.2; display: flex; flex-direction: column; align-items: center; }
    
    .main-img-box { position: relative; width: 100%; max-width: 400px; aspect-ratio: 1/1; background: #333; border-radius: 6px; overflow: hidden; }
    .main-img-box img { width: 100%; height: 100%; object-fit: cover; }
    
    /* Extra miniatyrbilder under huvudbilden */
    .thumbnails { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .thumbnails img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid rgba(0,0,0,0.2); }
    
    /* Gravyryta & Effekter */
    .gravure-zone { position: absolute; top: 25%; left: 25%; width: 50%; height: 50%; border: 1px dashed rgba(255,255,255,0.4); overflow: hidden; }
    .drag-item { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); cursor: grab; }
    .text-matte { font-family: 'Great Vibes', cursive; font-size: 28px; color: rgba(255,255,255,0.95); text-shadow: 0 0 3px rgba(255,255,255,0.7); white-space: nowrap; }
    .img-matte { width: 80px; filter: brightness(0) invert(1) opacity(0.85) drop-shadow(0 0 2px white); }
    .img-matte img { width: 100%; display: block; }

    .tools-side { flex: 0.8; background: rgba(255,255,255,0.4); padding: 2rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.5); }
    .field { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid rgba(0,0,0,0.15); border-radius: 4px; font-family: 'Josefin Sans'; }
    .btn { width: 100%; padding: 1rem; background: #111; color: #fff; border: none; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; border-radius: 4px; margin-top: 1rem; }
  </style>
</head>
<body>

  <a href="dricksglas.html" style="color:#111; text-decoration:none; font-size:0.8rem; text-transform:uppercase;">← Tillbaka till galleri</a>

  <div class="wrapper">
    <!-- VÄNSTER: Bilder och förhandsgranskning -->
    <div class="preview-side">
      <div class="main-img-box">
        <img id="mainView" src="" alt="Glas">
        <div class="gravure-zone" id="gZone">
          <div class="drag-item text-matte" id="cText"></div>
          <div class="drag-item img-matte" id="cImg" style="display:none;"><img id="rImg" src=""></div>
        </div>
      </div>
      <!-- Här hamnar extra bilderna automatiskt -->
      <div class="thumbnails" id="thumbBox"></div>
    </div>

    <!-- HÖGER: Verktyg -->
    <div class="tools-section tools-side">
      <h2 id="pName" style="font-family:'Cormorant Garamond'; font-size:2rem; margin-bottom:1.5rem;">Laddar produkt...</h2>
      
      <div style="margin-bottom:1.5rem;">
        <label style="font-size:0.75rem; text-transform:uppercase; display:block; margin-bottom:0.3rem;">Skriv text</label>
        <input type="text" id="tInput" class="field" placeholder="Ditt namn/text...">
      </div>

      <div>
        <label style="font-size:0.75rem; text-transform:uppercase; display:block; margin-bottom:0.3rem;">Ladda upp bildmotiv</label>
        <input type="file" id="fInput" accept="image/*">
      </div>

      <button class="btn" onclick="alert('Lagt i varukorgen!')">Lägg i varukorg</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>
    // Samma Firebase config som innan
    const firebaseConfig = { apiKey: "DIN_API_KEY", authDomain: "DITT_PROJEKT.firebaseapp.com", projectId: "DITT_PROJEKT_ID", storageBucket: "DITT_PROJEKT.appspot.com", messagingSenderId: "DIN_SENDER_ID", appId: "DITT_APP_ID" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    async function loadProduct() {
      if(!productId) return;
      const doc = await db.collection('dricksglas').doc(productId).get();
      if(doc.exists) {
        const p = doc.data();
        document.getElementById('pName').innerText = p.name;
        document.getElementById('mainView').src = p.imageUrl;

        // Om du sparat en array med extra bilder (t.ex. p.extraImages = ['url1', 'url2'])
        const thumbs = document.getElementById('thumbBox');
        thumbs.innerHTML = `<img src="${p.imageUrl}" onclick="document.getElementById('mainView').src='${p.imageUrl}'">`;
        if(p.extraImages) {
          p.extraImages.forEach(url => {
            thumbs.innerHTML += `<img src="${url}" onclick="document.getElementById('mainView').src='${url}'">`;
          });
        }

        if(p.gravureArea) {
          const z = document.getElementById('gZone');
          z.style.top = p.gravureArea.top+'%'; z.style.left = p.gravureArea.left+'%';
          z.style.width = p.gravureArea.width+'%'; z.style.height = p.gravureArea.height+'%';
        }
      }
    }

    // Text & Bild interaktion
    document.getElementById('tInput').addEventListener('input', e => {
      document.getElementById('cText').innerText = e.target.value;
    });
    document.getElementById('fInput').addEventListener('change', e => {
      const file = e.target.files[0];
      if(file) {
        const r = new FileReader();
        r.onload = ev => {
          document.getElementById('rImg').src = ev.target.result;
          document.getElementById('cImg').style.display = 'block';
        };
        r.readAsDataURL(file);
      }
    });

    // Enkel drag-logik för text/bild
    let moving = null;
    document.querySelectorAll('.drag-item').forEach(el => {
      el.addEventListener('mousedown', e => { moving = e.currentTarget; });
    });
    document.addEventListener('mousemove', e => {
      if(!moving) return;
      const rect = document.getElementById('gZone').getBoundingClientRect();
      moving.style.left = (e.clientX - rect.left) + 'px';
      moving.style.top = (e.clientY - rect.top) + 'px';
    });
    document.addEventListener('mouseup', () => moving = null);

    window.onload = loadProduct;
  </script>
</body>
</html>
