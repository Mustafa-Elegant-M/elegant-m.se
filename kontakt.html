<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kontakt — ELEGANT-M</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Josefin+Sans:wght@200;300;400;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(160deg, #2bb8c0 0%, #1e9aa2 30%, #178590 60%, #127880 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      font-family: 'Josefin Sans', sans-serif;
    }

    /* ── TOP BAR ── */
    .top-bar {
      width: 100%; max-width: 1200px;
      padding: 2rem 3rem 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .back-link {
      font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase;
      text-decoration: none; color: #111; opacity: 0.65;
      display: flex; align-items: center; gap: 0.5rem;
      transition: opacity 0.2s;
    }
    .back-link:hover { opacity: 1; }
    .back-link::before { content: '←'; font-size: 1rem; }
    .site-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 300; letter-spacing: 0.18em;
      background: linear-gradient(135deg, #111 0%, #2a2a2a 50%, #111 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; text-decoration: none;
    }
    .site-name span { font-style: italic; }
    .top-spacer { width: 100px; }

    /* ── PAGE TITLE ── */
    .page-title {
      text-align: center; padding: 2.5rem 1rem 0;
    }
    .page-title h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      font-weight: 300; letter-spacing: 0.15em;
      background: linear-gradient(135deg, #111 0%, #2a2a2a 50%, #111 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 0.8rem;
    }
    .page-title p {
      font-size: clamp(0.75rem, 1.4vw, 0.95rem);
      letter-spacing: 0.22em; text-transform: uppercase;
      color: #111; opacity: 0.6; font-weight: 300;
    }
    .divider {
      width: 120px; height: 0.5px;
      background: linear-gradient(90deg, transparent, #11111166, transparent);
      margin: 1.6rem auto 0;
    }

    /* ── FORM CARD ── */
    .form-card {
      width: min(94vw, 600px);
      background: linear-gradient(160deg, rgba(5,30,25,0.88) 0%, rgba(3,18,15,0.92) 100%);
      border: 0.5px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: clamp(2rem, 5vw, 3rem);
      margin: 2.5rem auto 3rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.35);
      animation: cardIn 0.45s ease both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── FIELDS ── */
    .field { margin-bottom: 1.5rem; }
    .field label {
      display: block;
      font-size: 0.68rem; letter-spacing: 0.28em; text-transform: uppercase;
      color: #aaa; margin-bottom: 0.55rem; font-weight: 400;
    }
    .field input,
    .field textarea {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 0.5px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 0.85rem 1.1rem;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.9rem; letter-spacing: 0.06em; font-weight: 300;
      color: #ddd;
      outline: none;
      transition: border-color 0.25s, background 0.25s;
    }
    .field input::placeholder,
    .field textarea::placeholder { color: rgba(255,255,255,0.25); }
    .field input:focus,
    .field textarea:focus {
      border-color: rgba(76,175,130,0.6);
      background: rgba(255,255,255,0.09);
    }
    .field textarea { resize: vertical; min-height: 130px; }

    /* ── SUBMIT ── */
    .submit-btn {
      width: 100%; padding: 1rem;
      background: linear-gradient(135deg, rgba(10,50,25,0.9), rgba(5,25,12,0.95));
      border: 0.5px solid rgba(76,175,130,0.4);
      border-radius: 30px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.8rem; letter-spacing: 0.3em; text-transform: uppercase;
      background-clip: text; -webkit-background-clip: text;
      cursor: pointer;
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.2s;
      position: relative; overflow: hidden;
    }
    .submit-btn::before {
      content: attr(data-label);
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #888, #eee, #bbb, #f5f5f5, #999);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 0.8rem; letter-spacing: 0.3em; text-transform: uppercase;
      font-family: 'Josefin Sans', sans-serif; font-weight: 600;
    }
    .submit-btn:hover {
      border-color: rgba(76,175,130,0.8);
      box-shadow: 0 0 20px rgba(76,175,130,0.2);
      transform: scale(1.02);
    }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ── STATUS MESSAGE ── */
    .status-msg {
      text-align: center; margin-top: 1.2rem;
      font-size: 0.8rem; letter-spacing: 0.12em;
      min-height: 1.2rem; transition: opacity 0.3s;
    }
    .status-msg.success { color: #4cff80; }
    .status-msg.error   { color: #ff7070; }

    /* ── SIGNATURE (in email only — shown as preview here) ── */
    /* This is used inside EmailJS template, not rendered on page */
  </style>
</head>
<body>

  <div class="top-bar">
    <a class="back-link" href="index.html">Tillbaka</a>
    <a class="site-name" href="index.html">ELEGANT<span>-M</span></a>
    <div class="top-spacer"></div>
  </div>

  <div class="page-title">
    <h1>Kontakta oss</h1>
    <p>Berätta om ditt önskemål — vi skapar det unikt för dig</p>
    <div class="divider"></div>
  </div>

  <div class="form-card">
    <form id="contact-form">

      <div class="field">
        <label for="from_name">Namn</label>
        <input type="text" id="from_name" name="from_name" placeholder="Ditt namn" required/>
      </div>

      <div class="field">
        <label for="from_email">E-postadress</label>
        <input type="email" id="from_email" name="from_email" placeholder="din@email.com" required/>
      </div>

      <div class="field">
        <label for="phone">Telefonnummer</label>
        <input type="tel" id="phone" name="phone" placeholder="+46 70 000 00 00"/>
      </div>

      <div class="field">
        <label for="message">Ditt önskemål</label>
        <textarea id="message" name="message" placeholder="Beskriv vad du vill gravera, på vilket material, och till vilket tillfälle..." required></textarea>
      </div>

      <button class="submit-btn" type="submit" data-label="Skicka förfrågan"></button>
    </form>
    <div class="status-msg" id="status-msg"></div>
  </div>

  <script>
    emailjs.init('syV4hDTJIVxj9xUyp');

    document.getElementById('contact-form').addEventListener('submit', function(e) {
      e.preventDefault();

      var btn = this.querySelector('.submit-btn');
      var msg = document.getElementById('status-msg');

      btn.disabled = true;
      btn.setAttribute('data-label', 'Skickar...');
      msg.className = 'status-msg';
      msg.textContent = '';

      var params = {
        from_name:  document.getElementById('from_name').value,
        from_email: document.getElementById('from_email').value,
        phone:      document.getElementById('phone').value,
        message:    document.getElementById('message').value,
        to_email:   'elegant.m.se@gmail.com'
      };

      // Send main notification to you
      emailjs.send('service_rqr0oai', 'template_kvc84w1', params)
        .then(function() {
          // Send auto-reply to customer
          return emailjs.send('service_rqr0oai', 'template_1qdf2dj', params);
        })
        .then(function() {
          msg.textContent = 'Tack! Vi återkommer inom 1–2 arbetsdagar.';
          msg.className = 'status-msg success';
          document.getElementById('contact-form').reset();
          btn.setAttribute('data-label', 'Skicka förfrågan');
          btn.disabled = false;
        })
        .catch(function(err) {
          msg.textContent = 'Något gick fel. Vänligen försök igen eller maila oss direkt.';
          msg.className = 'status-msg error';
          btn.setAttribute('data-label', 'Skicka förfrågan');
          btn.disabled = false;
          console.error('EmailJS error:', err);
        });
    });
  </script>

</body>
</html>
