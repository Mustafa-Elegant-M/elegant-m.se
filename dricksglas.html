<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dricksglas Kollektion — ELEGANT-M</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: linear-gradient(160deg, #f4f5f7, #aeb4ba); min-height: 100vh; font-family: 'Josefin Sans', sans-serif; color: #111; padding: 2rem; }
    .top-bar { max-width: 1200px; margin: 0 auto 2rem; display: flex; justify-content: space-between; align-items: center; }
    .site-name { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; text-decoration: none; color: #111; letter-spacing: 0.15em; }
    .catalog-title { text-align: center; font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-weight: 300; margin-bottom: 3rem; text-transform: uppercase; letter-spacing: 0.1em; }
    .grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2.5rem; }
    .product-card { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); border-radius: 8px; padding: 1rem; text-align: center; cursor: pointer; backdrop-filter: blur(10px); transition: transform 0.3s; }
    .product-card:hover { transform: translateY(-5px); }
    .img-box { width: 100%; aspect-ratio: 1/1; border-radius: 4px; overflow: hidden; background: #ddd; margin-bottom: 1rem; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }
    .product-card h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 400; letter-spacing: 0.05em; }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" style="color:#111; text-decoration:none; font-size:0.8rem; letter-spacing:0.1em; text-transform:uppercase;">← Tillbaka</a>
    <a href="index.html" class="site-name">ELEGANT<span>-M</span></a>
    <div></div>
  </div>

  <h1 class="catalog-title">Våra Dricksglas</h1>

  <div class="grid" id="catalogGrid">
    <div style="text-align:center; width:100%; opacity:0.5;">Laddar kollektionen...</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "DIN_API_KEY", authDomain: "DITT_PROJEKT.firebaseapp.com",
      projectId: "DITT_PROJEKT_ID", storageBucket: "DITT_PROJEKT.appspot.com",
      messagingSenderId: "DIN_SENDER_ID", appId: "DITT_APP_ID"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function getProducts() {
      const grid = document.getElementById('catalogGrid');
      try {
        const snapshot = await db.collection('dricksglas').get();
        grid.innerHTML = '';
        snapshot.forEach(doc => {
          const product = doc.data();
          grid.innerHTML += `
            <div class="product-card" onclick="goToDesign('${doc.id}')">
              <div class="img-box">
                <img src="${product.imageUrl}" alt="${product.name}">
              </div>
              <h3>${product.name}</h3>
            </div>
          `;
        });
      } catch (err) { grid.innerHTML = 'Kunde inte ladda produkter.'; }
    }

    function goToDesign(id) {
      // Skickar kunden till designstudion och skickar med rätt ID helt automatiskt!
      window.location.href = 'dricksglas-design.html?id=' + id;
    }
    window.onload = getProducts;
  </script>
</body>
</html>
