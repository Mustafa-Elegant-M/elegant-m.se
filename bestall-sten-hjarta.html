<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Designa din Stenplatta — ELEGANT-M</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Josefin+Sans:wght@200;300;400;600&family=Alegreya:ital,wght@0,400;0,700;1,400&family=Allura&family=Allerta+Stencil&display=swap" rel="stylesheet"/>
  
  <!-- Firebase för att hämta inställningar från Admin -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <!-- EmailJS för beställningar -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:linear-gradient(160deg,#8e9eab 0%,#606c76 30%,#4a5560 60%,#2c3e50 100%);min-height:100vh;font-family:'Josefin Sans',sans-serif;overflow-x:hidden;color:#111;}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,0.4) 0.5px,transparent 0.5px),radial-gradient(circle,rgba(200,200,200,0.3) 0.3px,transparent 0.3px),radial-gradient(circle,rgba(255,255,255,0.3) 0.4px,transparent 0.4px);background-size:28px 28px,18px 22px,40px 32px;background-position:0 0,7px 9px,15px 5px;animation:glitterShift 6s ease-in-out infinite alternate;}
    @keyframes glitterShift{0%{opacity:0.4}50%{opacity:0.9}100%{opacity:0.45}}

    .top-bar{position:relative;z-index:10;width:100%;max-width:1200px;margin:0 auto;padding:1.8rem 2.5rem 0;display:flex;align-items:center;justify-content:space-between;}
    .back-link{font-size:0.72rem;letter-spacing:0.25em;text-transform:uppercase;text-decoration:none;color:#111;opacity:0.65;display:flex;align-items:center;gap:0.5rem;transition:opacity 0.2s;}
    .back-link:hover{opacity:1;}
    .back-link::before{content:'←';font-size:1rem;}
    .site-name{font-family:'Cormorant Garamond',serif;font-size:clamp(1.3rem,2.5vw,1.9rem);font-weight:300;letter-spacing:0.18em;background:linear-gradient(135deg,#111 0%,#2a2a2a 50%,#111 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;white-space:nowrap;}
    .site-name span{font-style:italic;}

    .page-title{position:relative;z-index:10;text-align:center;padding:2rem 1rem 1.5rem;}
    .page-title h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.2rem,6vw,4.5rem);font-weight:300;letter-spacing:0.15em;background:linear-gradient(135deg,#111 0%,#333 50%,#111 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .page-title p{font-size:clamp(0.65rem,1.2vw,0.8rem);letter-spacing:0.28em;text-transform:uppercase;color:#111;opacity:0.55;margin-top:0.5rem;}

    .content{position:relative;z-index:10;width:min(96vw,1100px);margin:0 auto;padding:0 1rem 3rem;}
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start;}
    @media(max-width:900px){.cols{grid-template-columns:1fr;}}

    /* --- PREVIEW CANVAS --- */
    .canvas-wrap{position:relative;width:100%;aspect-ratio:1/1;border-radius:20px;overflow:hidden;box-shadow:0 15px 50px rgba(0,0,0,0.4);background:#222;margin-bottom:1rem;}
    .product-img{width:100%;height:100%;object-fit:contain;display:block;opacity:0.9;}
    .gravyr-zone{position:absolute;border:1px dashed rgba(0,255,180,0.3);z-index:3;overflow:hidden;pointer-events:none;}
    .svg-layer{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:4;}
    .hint-text{font-size:0.6rem;color:rgba(0,0,0,0.5);text-align:center;margin-bottom:1rem;font-style:italic;}

    /* --- CONTROLS --- */
    .form-section{background:rgba(255,255,255,0.15);border:0.5px solid rgba(0,0,0,0.1);border-radius:15px;padding:1.5rem;margin-bottom:1.5rem;backdrop-filter:blur(5px);}
    .form-label{font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;color:#111;opacity:0.7;margin-bottom:0.8rem;display:block;font-weight:600;}
    .form-input{width:100%;background:rgba(255,255,255,0.4);border:0.5px solid rgba(0,0,0,0.1);border-radius:10px;padding:0.8rem 1rem;font-family:'Josefin Sans',sans-serif;font-size:0.9rem;outline:none;margin-bottom:0.5rem;}

    /* ROW ITEMS */
    .rows-list{display:flex;flex-direction:column;gap:0.8rem;margin-bottom:1rem;}
    .row-item{background:rgba(255,255,255,0.2);border-radius:12px;padding:0.8rem;display:flex;flex-direction:column;gap:0.5rem;border:0.5px solid rgba(0,0,0,0.05);}
    .row-top{display:flex;align-items:center;gap:0.5rem;}
    .row-inp{flex:1;background:rgba(255,255,255,0.6);border:none;border-radius:8px;padding:0.5rem;font-family:'Josefin Sans',sans-serif;outline:none;}
    .row-del{width:24px;height:24px;border-radius:50%;border:none;background:rgba(0,0,0,0.1);cursor:pointer;color:#666;}
    
    .row-bottom{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;}
    .font-btn{padding:0.3rem 0.6rem;border-radius:6px;border:0.5px solid rgba(0,0,0,0.1);background:rgba(255,255,255,0.4);cursor:pointer;font-size:0.7rem;transition:all 0.2s;}
    .font-btn.active{background:#111;color:#fff;border-color:#111;}

    /* STYLE SWITCH (SCORE vs FILL) */
    .style-switch-wrap{display:flex;align-items:center;justify-content:center;gap:1rem;margin:1rem 0; padding:1rem; background:rgba(0,0,0,0.05); border-radius:50px;}
    .style-toggle{position:relative;width:60px;height:30px;background:#bbb;border-radius:15px;cursor:pointer;transition:0.3s;box-shadow:inset 0 2px 5px rgba(0,0,0,0.2);}
    .style-toggle .knob{position:absolute;width:24px;height:24px;background:#fff;border-radius:50%;top:3px;left:3px;transition:0.3s;box-shadow:0 2px 5px rgba(0,0,0,0.3);}
    .style-toggle.active{background:linear-gradient(135deg, #aaa, #666);}
    .style-toggle.active .knob{left:33px;}
    .style-lbl{font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;color:#333;}

    /* HANDLE STYLES (Same as metal card) */
    .row-handle-div{position:absolute;z-index:11;cursor:grab;touch-action:none;}
    .row-handle-strip{display:flex;align-items:center;gap:3px;padding:3px;background:rgba(0,18,12,0.9);border:0.5px solid rgba(0,255,180,0.4);border-radius:6px;opacity:0;transition:opacity 0.15s;pointer-events:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);}
    .row-handle-div.strip-visible .row-handle-strip{opacity:1;pointer-events:auto;}
    .hbtn{width:22px;height:20px;border-radius:4px;background:rgba(0,40,25,0.9);border:0.5px solid rgba(0,255,180,0.5);display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .hbtn svg{width:12px;height:12px;fill:none;stroke:rgba(0,255,180,1);stroke-width:1.5;}
    .hsize{width:60px;height:20px;background:rgba(0,40,25,0.8);border:0.5px solid rgba(0,255,180,0.4);border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:ew-resize;color:rgba(0,255,180,1);font-size:0.5rem;}

    .order-btn{width:100%;padding:1.2rem;background:linear-gradient(135deg,rgba(0,60,40,0.9),rgba(0,30,20,0.95));border:0.5px solid rgba(0,255,180,0.5);border-radius:30px;cursor:pointer;font-family:'Josefin Sans',sans-serif;font-size:0.8rem;letter-spacing:0.3em;text-transform:uppercase;color:rgba(0,255,180,0.9);margin-top:1.5rem;transition:all 0.3s;}
    .order-btn:hover{transform:scale(1.02);box-shadow:0 0 25px rgba(0,255,180,0.2);}

    .mini-footer{margin-top:3rem;padding:2rem 0;border-top:0.5px solid rgba(0,0,0,0.1);text-align:center;font-size:0.6rem;opacity:0.6;}
  </style>
</head>
<body>

<div class="top-bar">
  <a class="back-link" href="sten-former.html">Tillbaka</a>
  <a class="site-name" href="index.html">ELEGANT<span>-M</span></a>
  <div style="width:100px;"></div>
</div>

<div class="page-title">
  <h1>Designa din Stenplatta</h1>
  <p>Skapa ditt personliga minne med precision</p>
</div>

<div class="content">
  <div class="cols">
    
    <!-- VÄNSTER: PREVIEW -->
    <div>
      <div class="canvas-wrap" id="canvas-wrap">
        <img src="hjarta.png" class="product-img" id="prod-img">
        <div class="gravyr-zone" id="gravyr-zone">
          <svg class="svg-layer" id="main-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </div>
      <div class="hint-text">
        ✦ Hovra över texten för att flytta, rotera, skala eller böja. <br>
        Text utanför den streckade zonen graveras inte.
      </div>
    </div>

    <!-- HÖGER: KONTROLLER -->
    <div>
      <div class="form-section">
        <label class="form-label">Gravyrstil</label>
        <div class="style-switch-wrap">
          <span class="style-lbl">FILL</span>
          <div class="style-toggle" id="style-toggle" onclick="toggleStyle()">
            <div class="knob"></div>
          </div>
          <span class="style-lbl">SCORE</span>
        </div>
        <div style="font-size:0.55rem; text-align:center; opacity:0.6;">Fill = Solid silver | Score = Endast kontur</div>
      </div>

      <div class="form-section">
        <label class="form-label">Din Text</label>
        <div class="rows-list" id="rows-list"></div>
        <button class="add-row-btn" onclick="addRow()" style="background:none;border:0.5px dashed #111;padding:0.5rem;width:100%;cursor:pointer;font-family:'Josefin Sans';font-size:0.6rem;text-transform:uppercase;">+ Lägg till rad</button>
      </div>

      <div class="form-section">
        <label class="form-label">Kunden Info</label>
        <input class="form-input" type="text" id="cust-name" placeholder="Namn">
        <input class="form-input" type="email" id="cust-email" placeholder="E-post">
        <input class="form-input" type="text" id="cust-addr" placeholder="Adress">
        <button class="order-btn" onclick="sendOrder()">Skicka Beställning →</button>
      </div>
    </div>

  </div>
</div>

<div class="mini-footer">
  &copy; ALKAISY AB 559285-0588
</div>

<script>
// Firebase Konfiguration (Använd dina egna nycklar här)
const firebaseConfig = {
  apiKey: "AIzaSyCoRZnJl6gqQG7zmGzW2-aEKqtHXgcvaBg",
  authDomain: "elegant-m.firebaseapp.com",
  projectId: "elegant-m",
  storageBucket: "elegant-m.firebasestorage.app",
  messagingSenderId: "885190093704",
  appId: "1:885190093704:web:7bf7ac1a31dbf74011e83d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
emailjs.init('syV4hDTJIVxj9xUyp'); // Din EmailJS Public Key

// PRODUKT-ID (Ändra detta för varje form: 'sten-hjarta', 'sten-rond', etc.)
const PRODUCT_ID = "sten-hjarta";
const MAT_ID = "sten"; 

const FONTS = {alegreya:"'Alegreya',serif", allura:"'Allura',cursive", stencil:"'Allerta Stencil',sans-serif"};
const FONT_LABELS = {alegreya:'Alegreya', allura:'Allura', stencil:'Stencil'};

let productConfig = {};
let rows = [];
let rid = 0;
let currentStyle = 'fill'; 
let hDivs = {};

const $ = id => document.getElementById(id);

window.addEventListener('DOMContentLoaded', async () => {
  await loadConfig();
  addRow();
  redraw();
});

async function loadConfig() {
  try {
    const doc = await db.collection("materials").doc(MAT_ID).collection("products").doc(PRODUCT_ID).get();
    if (doc.exists) {
      productConfig = doc.data();
      setupZone();
    } else {
      console.error("Produkten hittades inte i databasen.");
    }
  } catch (e) {
    console.error("Firebase fel:", e);
  }
}

function setupZone() {
  const zone = $('gravyr-zone');
  zone.style.left = (productConfig.engraveZoneX || 10) + '%';
  zone.style.top = (productConfig.engraveZoneY || 20) + '%';
  zone.style.width = (productConfig.engraveWidth || 70) + '%';
  zone.style.height = (productConfig.engraveHeight || 60) + '%';
}

function toggleStyle() {
  if (!productConfig.allowStyle) return;
  const tgl = $('style-toggle');
  tgl.classList.toggle('active');
  currentStyle = tgl.classList.contains('active') ? 'score' : 'fill';
  redraw();
}

function addRow(txt = '') {
  const id = rid++;
  const r = {
    id: id, text: txt, font: 'alegreya', size: 20, 
    angle: 0, curve: 0, px: 50, py: 40 + (rows.length * 15)
  };
  rows.push(r);
  buildRowUI(r);
  redraw();
}

function buildRowUI(r) {
  const list = $('rows-list');
  const item = document.createElement('div');
  item.className = 'row-item';
  item.id = 'row-ui-' + r.id;

  item.innerHTML = `
    <div class="row-top">
      <input class="row-inp" type="text" value="${r.text}" placeholder="Skriv text..." oninput="updateText(${r.id}, this.value)">
      <button class="row-del" onclick="delRow(${r.id})">×</button>
    </div>
    <div class="row-bottom">
      ${Object.keys(FONTS).map(f => `<button class="font-btn ${r.font===f?'active':''}" onclick="updateFont(${r.id},'${f}', this)">${FONT_LABELS[f]}</button>`).join('')}
      <div style="margin-left:auto; display:flex; align-items:center; gap:5px;">
        <span style="font-size:0.6rem">Storlek:</span>
        <input type="number" style="width:40px; font-size:0.6rem;" value="${r.size}" oninput="updateSize(${r.id}, this.value)">
      </div>
    </div>
  `;
  list.appendChild(item);
}

function updateText(id, val) {
  const r = rows.find(x => x.id === id);
  if(r) { r.text = val; redraw(); }
}

function updateFont(id, font, btn) {
  const r = rows.find(x => x.id === id);
  if(r) {
    r.font = font;
    btn.parentElement.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    redraw();
  }
}

function updateSize(id, val) {
  const r = rows.find(x => x.id === id);
  if(r) { r.size = parseInt(val) || 10; redraw(); }
}

function delRow(id) {
  rows = rows.filter(x => x.id !== id);
  $(`row-ui-${id}`).remove();
  if(hDivs[id]) { hDivs[id].remove(); delete hDivs[id]; }
  redraw();
}

function redraw() {
  const svg = $('main-svg');
  const zone = $('gravyr-zone');
  const W = zone.offsetWidth || 300;
  const H = zone.offsetHeight || 200;
  
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = ''; 
  
  const ns = 'http://www.w3.org/2000/svg';
  const defs = document.createElementNS(ns, 'defs');
  defs.innerHTML = `
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee"/><stop offset="50%" stop-color="#999"/><stop offset="100%" stop-color="#ccc"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="0.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  `;
  svg.appendChild(defs);

  rows.forEach((r, i) => {
    if(!r.text) return;
    const cx = (r.px/100)*W;
    const cy = (r.py/100)*H;
    
    if(Math.abs(r.curve) > 2) {
      const estW = r.size * 0.6 * r.text.length;
      const sx = cx - estW/2;
      const ex = cx + estW/2;
      const cpY = cy - (r.curve/100) * r.size * 1.5;
      
      const path = document.createElementNS(ns, 'path');
      path.setAttribute('id', `path-${r.id}`);
      path.setAttribute('d', `M ${sx} ${cy} Q ${cx} ${cpY} ${ex} ${cy}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', 'none');
      if(r.angle && productConfig.allowRotation) path.setAttribute('transform', `rotate(${r.angle},${cx},${cy})`);
      svg.appendChild(path);

      const te = document.createElementNS(ns, 'text');
      te.setAttribute('font-family', FONTS[r.font]);
      te.setAttribute('font-size', r.size);
      te.setAttribute('filter', 'url(#glow)');
      
      if(currentStyle === 'fill') {
        te.setAttribute('fill', 'url(#silverGrad)');
      } else {
        te.setAttribute('fill', 'none');
        te.setAttribute('stroke', 'url(#silverGrad)');
        te.setAttribute('stroke-width', '0.5');
      }

      const tp = document.createElementNS(ns, 'textPath');
      tp.setAttribute('href', `#path-${r.id}`);
      tp.setAttribute('startOffset', '50%');
      tp.setAttribute('text-anchor', 'middle');
      tp.textContent = r.text;
      te.appendChild(tp);
      svg.appendChild(te);
    } else {
      const te = document.createElementNS(ns, 'text');
      te.setAttribute('x', cx);
      te.setAttribute('y', cy);
      te.setAttribute('text-anchor', 'middle');
      te.setAttribute('dominant-baseline', 'middle');
      te.setAttribute('font-family', FONTS[r.font]);
      te.setAttribute('font-size', r.size);
      te.setAttribute('filter', 'url(#glow)');
      if(r.angle && productConfig.allowRotation) te.setAttribute('transform', `rotate(${r.angle},${cx},${cy})`);
      
      if(currentStyle === 'fill') {
        te.setAttribute('fill', 'url(#silverGrad)');
      } else {
        te.setAttribute('fill', 'none');
        te.setAttribute('stroke', 'url(#silverGrad)');
        te.setAttribute('stroke-width', '0.5');
      }
      te.textContent = r.text;
      svg.appendChild(te);
    }
    createHandle(r, zone);
  });
}

function createHandle(r, zone) {
  if(hDivs[r.id]) return;
  
  const div = document.createElement('div');
  div.className = 'row-handle-div';
  zone.appendChild(div);
  hDivs[r.id] = div;

  div.addEventListener('mouseenter', () => div.classList.add('strip-visible'));
  div.addEventListener('mouseleave', () => {
    if(!div.dataset.dragging) div.classList.remove('strip-visible');
  });

  const strip = document.createElement('div');
  strip.className = 'row-handle-strip';
  
  // Rotation - Only if allowed in Admin
  if(productConfig.allowRotation) {
    const btnRot = document.createElement('div');
    btnRot.className = 'hbtn';
    btnRot.innerHTML = '<svg viewBox="0 0 11 11"><path d="M1 10L10 1M7 1L10 1L10 4"/></svg>';
    btnRot.onpointerdown = (e) => {
      e.stopPropagation();
      div.dataset.dragging = "true";
      let sx = e.clientX;
      function move(ev) {
        r.angle = (r.angle || 0) + (ev.clientX - sx) * 0.5;
        sx = e.clientX;
        redraw();
      }
      function up() { 
        window.removeEventListener('pointermove', move);
        div.dataset.dragging = "";
        div.classList.remove('strip-visible');
      }
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up, {once:true});
    };
    strip.appendChild(btnRot);
  }

  // Size
  const bSiz = document.createElement('div');
  bSiz.className = 'hsize';
  bSiz.textContent = r.size + 'px';
  bSiz.onpointerdown = (e) => {
    e.stopPropagation();
    div.dataset.dragging = "true";
    let sx = e.clientX;
    function move(ev) {
      r.size = Math.max(5, r.size + (ev.clientX - sx) * 0.3);
      sx = e.clientX;
      redraw();
    }
    function up() { 
      window.removeEventListener('pointermove', move);
      div.dataset.dragging = "";
      div.classList.remove('strip-visible');
    }
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up, {once:true});
  };
  strip.appendChild(bSiz);

  // Curve - Only if allowed in Admin
  if(productConfig.allowCurve) {
    const btnCur = document.createElement('div');
    btnCur.className = 'hbtn';
    btnCur.innerHTML = '<svg viewBox="0 0 11 11"><path d="M1 9Q5.5 2 10 9"/></svg>';
    btnCur.onpointerdown = (e) => {
      e.stopPropagation();
      div.dataset.dragging = "true";
      let sy = e.clientY;
      function move(ev) {
        r.curve = (r.curve || 0) - (ev.clientY - sy) * 0.8;
        sy = e.clientY;
        redraw();
      }
      function up() { 
        window.removeEventListener('pointermove', move);
        div.dataset.dragging = "";
        div.classList.remove('strip-visible');
      }
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up, {once:true});
    };
    strip.appendChild(btnCur);
  }

  div.appendChild(strip);

  // Move - Only if allowed in Admin
  if(productConfig.allowMovable) {
    div.onpointerdown = (e) => {
      if(e.target.closest('.hbtn, .hsize')) return;
      e.preventDefault();
      div.dataset.dragging = "true";
      let sx = e.clientX, sy = e.clientY;
      let spx = r.px, spy = r.py;
      const zR = zone.getBoundingClientRect();
      function move(ev) {
        r.px = Math.max(0, Math.min(100, spx + (ev.clientX - sx)/zR.width * 100));
        r.py = Math.max(0, Math.min(100, spy + (ev.clientY - sy)/zR.height * 100));
        redraw();
      }
      function up() {
        window.removeEventListener('pointermove', move);
        div.dataset.dragging = "";
        div.classList.remove('strip-visible');
      }
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up, {once:true});
    };
  }

  const W = zone.offsetWidth || 300, H = zone.offsetHeight || 200;
  const estW = r.size * 0.6 * (r.text.length || 3);
  div.style.width = estW + 'px';
  div.style.height = (r.size * 1.3) + 'px';
  div.style.left = ((r.px/100)*W - estW/2) + 'px';
  div.style.top = ((r.py/100)*H - (r.size*1.3/2)) + 'px';
  div.style.transform = `rotate(${r.angle}deg)`;
}

async function sendOrder() {
  const name = $('cust-name').value.trim();
  const email = $('cust-email').value.trim();
  if(!name || !email) { alert("Fyll i namn och e-post."); return; }

  const designSummary = rows.map((r, i) => `Rad ${i+1}: ${r.text} (${r.font}, ${r.size}px, ${r.angle}°, ${r.curve})`).join('\n');
  const msg = `Ny beställning på ${PRODUCT_ID}\n\nKund: ${name}\nEmail: ${email}\nStil: ${currentStyle}\n\nDesign:\n${designSummary}`;
  
  try {
    await emailjs.send('service_rqr0oai', 'template_kvc84w1', {
      from_name: name,
      from_email: email,
      message: msg,
      to_email: 'elegant.m.se@gmail.com'
    });
    alert("Beställningen är skickad! Vi återkommer via e-post.");
  } catch (e) {
    alert("Fel vid sändning. Vänligen prova igen.");
  }
}
