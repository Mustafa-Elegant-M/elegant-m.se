<html lang="sv">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Läder — ELEGANT-M</title>
  <meta name="description" content="Personliga lasergravyrer på läder. Lyxig finish och tidlös design. ELEGANT-M."/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Josefin+Sans:wght@200;300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    /* Mörkbrun läderbakgrund */
    body{
      background: radial-gradient(circle at center, #3e2723 0%, #2a1a14 50%, #1a110d 100%);
      min-height:100vh;
      font-family:'Josefin Sans',sans-serif;
      overflow-x:hidden;
    }
    /* Läderfiber-textur */
    body::before{
      content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.03) 6px, rgba(255,255,255,0.03) 7px);
      opacity:0.4;
    }

    .top-bar{position:relative;z-index:10;width:100%;max-width:1200px;margin:0 auto;padding:1.8rem 2.5rem 0;display:flex;align-items:center;justify-content:space-between;}
    .back-link{font-size:0.72rem;letter-spacing:0.25em;text-transform:uppercase;text-decoration:none;color:#d7c4b0;opacity:0.7;display:flex;align-items:center;gap:0.5rem;transition:opacity 0.2s;}
    .back-link:hover{opacity:1;}
    .back-link::before{content:'←';font-size:1rem;}
    .site-name{font-family:'Cormorant Garamond',serif;font-size:clamp(1.3rem,2.5vw,1.9rem);font-weight:300;letter-spacing:0.18em;color:#f0e2d5;text-decoration:none;white-space:nowrap;}
    .site-name span{font-style:italic;}
    .top-spacer{width:100px;}

    .page-title{position:relative;z-index:10;text-align:center;padding:2rem 1rem 0.5rem;}
    .page-title h1{font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,8vw,6rem);font-weight:300;letter-spacing:0.15em;color:#f0e2d5;}
    .page-title p{font-size:clamp(0.7rem,1.3vw,0.85rem);letter-spacing:0.28em;text-transform:uppercase;color:#a68969;margin-top:0.5rem;}
    .title-line{width:120px;height:0.5px;margin:1.2rem auto 0;background:linear-gradient(90deg,transparent,#a68969,transparent);}

    .btn-container{position:relative;z-index:10;width:min(98vw,1200px);aspect-ratio:980/920;margin:0 auto;}
    .hex-btn{position:absolute;transform:translate(-50%,-50%);width:min(15vw,145px);height:min(15vw,145px);cursor:pointer;transition:transform 0.25s;display:block;text-decoration:none;}
    .hex-btn.coming{cursor:default;}
    .hex-btn.active:hover{transform:translate(-50%,-50%) scale(1.08);}
    .hex-btn svg{width:100%;height:100%;overflow:visible;}
    
    .hex-fill{fill:url(#hexGrad);}
    .hex-btn.coming .hex-fill{fill:url(#hexGradDim);opacity:0.6;}
    
    /* Neon Dynamik */
    .hex-stroke{fill:none;stroke:#00f2ff;stroke-width:2;stroke-linejoin:round;animation:neonPulse 1.5s ease-in-out infinite alternate;filter:url(#neonGlow);}
    @keyframes neonPulse{0%{stroke-width:1.5;stroke-opacity:0.6;filter:url(#neonGlowDim);}100%{stroke-width:3;stroke-opacity:1;filter:url(#neonGlow);}}
    .hex-btn.coming .hex-stroke{stroke:#333;stroke-width:1;animation:none;filter:none;}
    
    .hex-icon{font-size:clamp(1.1rem,2.2vw,1.6rem);line-height:1;text-align:center;color:#fff;}
    .hex-label{font-family:'Josefin Sans',sans-serif;font-size:clamp(0.35rem,0.7vw,0.55rem);letter-spacing:0.05em;text-transform:uppercase;font-weight:600;color:#fff;text-align:center;line-height:1.2;width:70%;margin:0 auto;}
    .hex-btn.coming .hex-label{color:rgba(255,255,255,0.3);}

    .mini-footer{position:relative;z-index:10;width:100%;border-top:0.5px solid rgba(255,255,255,0.1);padding:1rem 0;margin-top:2rem;}
    .mini-footer-inner{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:center;width:100%;max-width:1200px;margin:0 auto;padding:0 2rem;gap:1rem;}
    .mini-footer-links a{font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;color:#a68969;opacity:0.7;padding:0 0.7rem;border-right:1px solid rgba(166,137,105,0.3);line-height:1;transition:opacity 0.2s;}
    .mini-footer-links a:last-child{border-right:none;}
    .mini-footer-mid{font-size:0.62rem;letter-spacing:0.12em;text-transform:uppercase;color:#a68969;opacity:0.6;}
    .mini-footer-copy{font-size:0.62rem;letter-spacing:0.08em;color:#a68969;opacity:0.6;text-align:right;}
    
    @media(max-width:600px){
      .top-bar{padding:1.2rem 1.2rem 0;}
      .site-name{font-size:1rem;letter-spacing:0.1em;}
      .mini-footer-inner{flex-direction:column;align-items:center;gap:0.6rem;text-align:center;}
    }
  </style>
</head>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- Mörk turkos gradient för knappens inre -->
    <radialGradient id="hexGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#008080"/><stop offset="100%" stop-color="#004d4d"/>
    </radialGradient>
    <radialGradient id="hexGradDim" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2a2a2a"/><stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    <!-- Neon glöd effekt -->
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonGlowDim">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
