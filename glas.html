  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    /* Silverfärg-tema: Elegant övergång från ljust till mörkare silver/grått */
    body{background:linear-gradient(160deg,#f4f5f7 0%,#d5d9de 30%,#aeb4ba 60%,#858b92 100%);min-height:100vh;font-family:'Josefin Sans',sans-serif;overflow-x:hidden;}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,0.5) 0.5px,transparent 0.5px),radial-gradient(circle,rgba(200,200,200,0.4) 0.3px,transparent 0.3px),radial-gradient(circle,rgba(255,255,255,0.4) 0.4px,transparent 0.4px);background-size:28px 28px,18px 22px,40px 32px;background-position:0 0,7px 9px,15px 5px;animation:glitterShift 6s ease-in-out infinite alternate;}
    @keyframes glitterShift{0%{opacity:0.4}50%{opacity:0.9}100%{opacity:0.45}}

    .top-bar{position:relative;z-index:10;width:100%;max-width:1200px;margin:0 auto;padding:1.8rem 2.5rem 0;display:flex;align-items:center;justify-content:space-between;}
    .back-link{font-size:0.72rem;letter-spacing:0.25em;text-transform:uppercase;text-decoration:none;color:#111;opacity:0.65;display:flex;align-items:center;gap:0.5rem;transition:opacity 0.2s;}
    .back-link:hover{opacity:1;}
    .back-link::before{content:'←';font-size:1rem;}
    .site-name{font-family:'Cormorant Garamond',serif;font-size:clamp(1.3rem,2.5vw,1.9rem);font-weight:300;letter-spacing:0.18em;background:linear-gradient(135deg,#111 0%,#2a2a2a 50%,#111 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;white-space:nowrap;}
    .site-name span{font-style:italic;}
    .top-spacer{width:100px;}

    .page-title{position:relative;z-index:10;text-align:center;padding:2rem 1rem 0.5rem;}
    .page-title h1{font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,8vw,6rem);font-weight:300;letter-spacing:0.15em;background:linear-gradient(135deg,#111 0%,#333 50%,#111 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .page-title p{font-size:clamp(0.7rem,1.3vw,0.85rem);letter-spacing:0.28em;text-transform:uppercase;color:#111;opacity:0.55;margin-top:0.5rem;}
    .title-line{width:120px;height:0.5px;margin:1.2rem auto 0;background:linear-gradient(90deg,transparent,#111a,transparent);}

    .btn-container{position:relative;z-index:10;width:min(98vw,1200px);aspect-ratio:980/920;margin:0 auto;}
    .hex-btn{position:absolute;transform:translate(-50%,-50%);width:min(15vw,145px);height:min(15vw,145px);cursor:pointer;transition:transform 0.25s;display:block;text-decoration:none;}
    .hex-btn.coming{cursor:default;}
    .hex-btn.active:hover{transform:translate(-50%,-50%) scale(1.08);}
    .hex-btn svg{width:100%;height:100%;overflow:visible;}
    .hex-fill{fill:url(#hexGrad);}
    .hex-btn.coming .hex-fill{fill:url(#hexGradDim);opacity:0.6;}
    .hex-stroke{fill:none;stroke:#ffffff;stroke-width:1.8;stroke-linejoin:round;animation:neonStroke 2.5s ease-in-out infinite alternate;filter:url(#neonGlow);}
    @keyframes neonStroke{0%{stroke-opacity:0.75;stroke-width:1.4;}100%{stroke-opacity:1.0;stroke-width:2.2;}}
    .hex-btn.coming .hex-stroke{stroke:#cccccc;stroke-width:1;stroke-opacity:0.35;animation:none;filter:none;}
    .hex-icon{font-size:clamp(1.1rem,2.2vw,1.6rem);line-height:1;filter:drop-shadow(0 0 4px rgba(255,255,255,0.5));text-align:center;}
    
    .hex-label{
      font-family:'Josefin Sans',sans-serif;
      font-size:clamp(0.32rem,0.7vw,0.52rem);
      letter-spacing:0.05em;
      text-transform:uppercase;
      font-weight:600;
      background:linear-gradient(135deg,#999,#eee,#bbb,#f5f5f5,#aaa);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      text-align:center;
      line-height:1.2;
      width:60%;
      margin:0 auto;
      padding:0 2px;
    }
    .hex-btn.coming .hex-label{background:none;-webkit-text-fill-color:rgba(160,160,160,0.4);font-size:clamp(0.3rem,0.6vw,0.45rem);}

    .mini-footer{position:relative;z-index:10;width:100%;border-top:0.5px solid rgba(0,0,0,0.2);padding:1rem 0;margin-top:2rem;}
    .mini-footer-inner{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:center;width:100%;max-width:1200px;margin:0 auto;padding:0 2rem;gap:1rem;}
    .mini-footer-links{display:flex;gap:0;align-items:center;}
    .mini-footer-links a{font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;color:#111;opacity:0.6;padding:0 0.7rem;border-right:1px solid rgba(0,0,0,0.2);line-height:1;transition:opacity 0.2s;}
    .mini-footer-links a:first-child{padding-left:0;}
    .mini-footer-links a:last-child{border-right:none;}
    .mini-footer-links a:hover{opacity:1;}
    .mini-footer-mid{font-size:0.62rem;letter-spacing:0.12em;text-transform:uppercase;color:#111;opacity:0.6;}
    .mini-footer-copy{font-size:0.62rem;letter-spacing:0.08em;color:#111;opacity:0.6;text-align:right;}

    @media(max-width:600px){
      .top-bar{padding:1.2rem 1.2rem 0;}
      .site-name{font-size:1rem;letter-spacing:0.1em;}
      .top-spacer{width:50px;}
      .hex-btn{width:min(18vw,90px);height:min(18vw,90px);}
      .hex-label{font-size:0.28rem;letter-spacing:0.02em;}
      .hex-icon{font-size:0.95rem;}
      .mini-footer-inner{flex-direction:column;align-items:center;gap:0.6rem;text-align:center;}
    }
  </style>
</head>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- Mörkare hexagoner för att texten och det vita neon-ljuset ska synas skarpt mot den silvriga bakgrunden -->
    <radialGradient id="hexGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b444b"/><stop offset="50%" stop-color="#23282d"/><stop offset="100%" stop-color="#0f1114"/>
    </radialGradient>
    <radialGradient id="hexGradDim" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2c3338"/><stop offset="100%" stop-color="#0f1114"/>
    </radialGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
