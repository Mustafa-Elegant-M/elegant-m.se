<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Designa Gravyr — ELEGANT-M</title>
  
  <!-- Hämtar in typsnitt (inkl. Great Vibes för elegant skrivstil) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Great+Vibes&family=Josefin+Sans:wght@200;300;400;600&display=swap" rel="stylesheet"/>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: linear-gradient(160deg, #f4f5f7 0%, #d5d9de 30%, #aeb4ba 60%, #858b92 100%);
      min-height: 100vh;
      font-family: 'Josefin Sans', sans-serif;
      color: #111;
      overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(circle, rgba(255,255,255,0.5) 0.5px, transparent 0.5px),
                        radial-gradient(circle, rgba(200,200,200,0.4) 0.3px, transparent 0.3px);
      background-size: 28px 28px, 18px 22px;
      animation: glitterShift 6s ease-in-out infinite alternate;
    }
    @keyframes glitterShift { 0% { opacity: 0.4 } 100% { opacity: 0.8 } }

    /* Navigering */
    .top-bar {
      position: relative; z-index: 10; max-width: 1200px; margin: 0 auto;
      padding: 1.8rem 2.5rem 0; display: flex; align-items: center; justify-content: space-between;
    }
    .back-link {
      font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase; text-decoration: none;
      color: #111; opacity: 0.65; display: flex; align-items: center; gap: 0.5rem;
    }
    .site-name {
      font-family: 'Cormorant Garamond', serif; font-size: 1.9rem; font-weight: 300;
      letter-spacing: 0.18em; text-decoration: none; color: #111;
    }
    .site-name span { font-style: italic; }

    /* Layout för redigeraren */
    .editor-wrapper {
      position: relative; z-index: 10; max-width: 1200px; margin: 2rem auto;
      display: flex; gap: 2rem; padding: 0 2rem; align-items: flex-start;
    }

    /* VÄNSTER: Förhandsgranskning */
    .preview-section {
      flex: 1;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 8px;
      padding: 1rem;
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .glass-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1/1;
      background: #444; 
      border-radius: 4px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.2);
    }
    .glass-container img.product-bg {
      width: 100%; height: 100%; object-fit: cover; pointer-events: none;
    }

    /* Gravyrytan */
    .gravure-bounds {
      position: absolute;
      top: 20%; left: 20%; width: 60%; height: 60%; 
      border: 1px dashed rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.03);
      overflow: hidden;
    }

    /* Gemensam klass för allt som kan dras runt */
    .draggable-item {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      cursor: grab;
    }
    .draggable-item:active { cursor: grabbing; }

    /* Specifik styling för Bild */
    .image-item {
      width: 80px; /* Startstorlek bild */
      filter: brightness(0) invert(1) opacity(0.85) drop-shadow(0px 0px 2px rgba(255,255,255,0.5));
    }
    .image-item img { width: 100%; height: auto; pointer-events: none; display: block; }

    /* Specifik styling för Text (Crystal White Matte effekten för text) */
    .text-item {
      font-size: 24px;
      white-space: nowrap;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0px 0px 3px rgba(255,255,255,0.6);
      line-height: 1;
    }

    /* HÖGER: Verktygspanel */
    .tools-section {
      width: 380px;
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .tools-section h2 {
      font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 300;
      margin-bottom: 1.5rem; text-align: center;
    }

    /* Verktygs-sektioner */
    .tool-box {
      background: rgba(255,255,255,0.3);
      padding: 1.2rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      border: 1px solid rgba(255,255,255,0.5);
    }
    .tool-box h3 {
      font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 1rem; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 0.5rem;
    }

    .tool-group { margin-bottom: 1rem; }
    .tool-group label {
      display: block; font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase;
      margin-bottom: 0.4rem; font-weight: 600; opacity: 0.8;
    }

    /* Formulärelement */
    .custom-input, .custom-select {
      width: 100%; padding: 0.8rem;
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(0,0,0,0.15);
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.9rem; color: #111; outline: none;
      border-radius: 4px; transition: border-color 0.2s;
    }
    .custom-input:focus, .custom-select:focus { border-color: #111; }

    .custom-file-upload {
      display: block; width: 100%; padding: 0.8rem; text-align: center;
      border: 1px solid #111; background: transparent; color: #111;
      font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; transition: all 0.3s; border-radius: 4px;
    }
    .custom-file-upload:hover { background: #111; color: #fff; }
    input[type="file"] { display: none; }

    input[type="range"] { width: 100%; cursor: pointer; accent-color: #111; }

    @media(max-width: 800px) {
      .editor-wrapper { flex-direction: column; padding: 0 1rem; }
      .tools-section { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a class="back-link" href="glas-dricksglas.html">Tillbaka</a>
    <a class="site-name" href="index.html">ELEGANT<span>-M</span></a>
    <div style="width: 80px;"></div>
  </div>

  <div class="editor-wrapper">
    
    <!-- VÄNSTER: Förhandsgranskning -->
    <div class="preview-section">
      <div class="glass-container">
        <!-- Byt ut mot ditt riktiga dricksglas från databasen -->
        <img class="product-bg" src="https://via.placeholder.com/600x600/80868b/ffffff?text=Bild+på+Ditt+Glas" alt="Glas">
        
        <!-- Gravyrområdet -->
        <div class="gravure-bounds" id="bounds">
          
          <!-- BILDELEMENTET -->
          <div class="draggable-item image-item" id="designImage" style="display: none;">
             <img id="uploadedImage" src="" alt="Uppladdad logotyp">
          </div>

          <!-- TEXTELEMENTET -->
          <div class="draggable-item text-item" id="designText" style="display: none;">
             <!-- Texten hamnar här -->
          </div>

        </div>
      </div>
    </div>

    <!-- HÖGER: Verktyg -->
    <div class="tools-section">
      <h2>Anpassa Gravyr</h2>
      
      <!-- BILDVERKTYG -->
      <div class="tool-box">
        <h3>1. Ladda upp Logotyp / Motiv</h3>
        <div class="tool-group">
          <label class="custom-file-upload">
            <input type="file" id="imageUpload" accept="image/png, image/jpeg">
            Välj bildfil
          </label>
        </div>
        <div class="tool-group">
          <label>Bildstorlek</label>
          <input type="range" id="imgSizeSlider" min="20" max="250" value="80">
        </div>
      </div>

      <!-- TEXTVERKTYG -->
      <div class="tool-box">
        <h3>2. Skriv Text</h3>
        <div class="tool-group">
          <label>Din text</label>
          <input type="text" id="textInput" class="custom-input" placeholder="T.ex. Grattis på 50-årsdagen!">
        </div>
        
        <div class="tool-group">
          <label>Typsnitt</label>
          <select id="fontSelect" class="custom-select">
            <option value="'Josefin Sans', sans-serif">Stilren & Modern (Josefin)</option>
            <option value="'Cormorant Garamond', serif">Klassisk med serifer (Cormorant)</option>
            <option value="'Great Vibes', cursive">Elegant Skrivstil (Great Vibes)</option>
          </select>
        </div>

        <div class="tool-group">
          <label>Textstorlek</label>
          <input type="range" id="textSizeSlider" min="12" max="80" value="24">
        </div>
      </div>

      <p style="font-size: 0.75rem; text-align: center; opacity: 0.7; margin-top: 1rem;">
        <i>Dra texten och bilden över glaset för att placera dem rätt.</i>
      </p>

    </div>

  </div>

  <script>
    // --- 1. LOGIK FÖR BILDUPPLADDNING ---
    const imageUpload = document.getElementById('imageUpload');
    const uploadedImage = document.getElementById('uploadedImage');
    const designImage = document.getElementById('designImage');
    const imgSizeSlider = document.getElementById('imgSizeSlider');

    imageUpload.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          uploadedImage.src = event.target.result;
          designImage.style.display = 'block'; 
        }
        reader.readAsDataURL(file);
      }
    });

    imgSizeSlider.addEventListener('input', function(e) {
      designImage.style.width = e.target.value + 'px';
    });


    // --- 2. LOGIK FÖR TEXT ---
    const textInput = document.getElementById('textInput');
    const fontSelect = document.getElementById('fontSelect');
    const textSizeSlider = document.getElementById('textSizeSlider');
    const designText = document.getElementById('designText');

    textInput.addEventListener('input', function(e) {
      designText.innerText = e.target.value;
      if(e.target.value.trim() !== "") {
        designText.style.display = 'block';
      } else {
        designText.style.display = 'none';
      }
    });

    fontSelect.addEventListener('change', function(e) {
      designText.style.fontFamily = e.target.value;
    });

    textSizeSlider.addEventListener('input', function(e) {
      designText.style.fontSize = e.target.value + 'px';
    });


    // --- 3. UNIVERSELL "DRAG AND DROP" (Fungerar för både text och bild) ---
    let activeDragItem = null;
    let isDragging = false;
    let startX, startY, initialLeft, initialTop;

    // Hitta alla objekt som får dras (bilden + texten)
    const draggables = document.querySelectorAll('.draggable-item');

    draggables.forEach(item => {
      item.addEventListener('mousedown', dragStart);
      item.addEventListener('touchstart', dragStart, {passive: false});
    });

    document.addEventListener('mousemove', drag);
    document.addEventListener('touchmove', drag, {passive: false});
    
    document.addEventListener('mouseup', dragEnd);
    document.addEventListener('touchend', dragEnd);

    function dragStart(e) {
      activeDragItem = e.currentTarget;
      isDragging = true;
      
      const event = e.type.includes('mouse') ? e : e.touches[0];
      startX = event.clientX;
      startY = event.clientY;
      
      initialLeft = activeDragItem.offsetLeft;
      initialTop = activeDragItem.offsetTop;
    }

    function drag(e) {
      if (!isDragging || !activeDragItem) return;
      e.preventDefault(); // Stoppar fönstret från att scrolla när man drar på mobil
      
      const event = e.type.includes('mouse') ? e : e.touches[0];
      const dx = event.clientX - startX;
      const dy = event.clientY - startY;

      activeDragItem.style.left = (initialLeft + dx) + 'px';
      activeDragItem.style.top = (initialTop + dy) + 'px';
    }

    function dragEnd() {
      isDragging = false;
      activeDragItem = null;
    }
  </script>

</body>
</html>
