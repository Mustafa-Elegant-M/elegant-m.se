<html lang="sv">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kampanj — ELEGANT-M</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    
    /* Guld-bakgrund */
    body{
      background: radial-gradient(circle at center, #ffd700 0%, #b8860b 100%);
      min-height:100vh;
      font-family:'Josefin Sans',sans-serif;
      overflow-x:hidden;
      position: relative;
    }

    /* Stjärnhimmel som följer med vid scroll (Absolute position) */
    body::before {
      content: "";
      position: absolute; /* Ändrat från fixed till absolute */
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1.5px, transparent 1.5px),
        radial-gradient(white 2px, transparent 2px);
      background-size: 200px 200px, 300px 300px, 400px 400px;
      background-position: 0 0, 50px 50px, 100px 100px;
      animation: twinkle 4s infinite ease-in-out;
      pointer-events: none;
      z-index: 1;
      opacity: 0.9;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* Layout-containrar */
    .top-bar, .page-title, .btn-container, .mini-footer {
      position: relative;
      z-index: 2;
    }

    .top-bar{width:100%;max-width:1200px;margin:0 auto;padding:1.8rem 2.5rem 0;display:flex;align-items:center;justify-content:space-between;}
    .back-link{font-size:0.72rem;letter-spacing:0.25em;text-transform:uppercase;text-decoration:none;color:#fff;opacity:0.8;display:flex;align-items:center;gap:0.5rem;transition:opacity 0.2s;text-shadow:0 0 5px rgba(0,0,0,0.2);}
    .back-link:hover{opacity:1;}
    .back-link::before{content:'←';font-size:1rem;}
    .site-name{font-family:'Cormorant Garamond',serif;font-size:clamp(1.3rem,2.5vw,1.9rem);font-weight:300;letter-spacing:0.18em;color:#fff;text-decoration:none;white-space:nowrap;text-shadow:0 0 10px rgba(0,0,0,0.3);}
    .site-name span{font-style:italic;}
    .top-spacer{width:100px;}

    .page-title{text-align:center;padding:2rem 1rem 0.5rem;}
    .page-title h1{font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,8vw,6rem);font-weight:300;letter-spacing:0.15em;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,0.2);}
    .page-title p{font-size:clamp(0.7rem,1.3vw,0.85rem);letter-spacing:0.28em;text-transform:uppercase;color:#fff;margin-top:0.5rem;opacity:0.9;}
    .title-line{width:120px;height:0.5px;margin:1.2rem auto 0;background:linear-gradient(90deg,transparent,#fff,transparent);}

    .btn-container{width:min(98vw,1200px);aspect-ratio:980/920;margin:0 auto;}
    .hex-btn{position:absolute;transform:translate(-50%,-50%);width:min(15vw,145px);height:min(15vw,145px);cursor:pointer;transition:transform 0.25s;display:block;text-decoration:none;}
    .hex-btn.coming{cursor:default;}
    .hex-btn.active:hover{transform:translate(-50%,-50%) scale(1.08);}
    .hex-btn svg{width:100%;height:100%;overflow:visible;}
    
    .hex-fill{fill:url(#hexGradSilver);}
    .hex-btn.coming .hex-fill{fill:url(#hexGradDimSilver);opacity:0.6;}
    
    .hex-stroke{fill:none;stroke:#ffd700;stroke-width:2;stroke-linejoin:round;animation:neonPulse 1.5s ease-in-out infinite alternate;filter:url(#neonGlowGold);}
    @keyframes neonPulse{0%{stroke-width:1.5;stroke-opacity:0.6;filter:url(#neonGlowGoldDim);}100%{stroke-width:3;stroke-opacity:1;filter:url(#neonGlowGold);}}
    
    .hex-btn.coming .hex-stroke{stroke:#b8860b;stroke-width:1;animation:none;filter:none;opacity:0.5;}
    
    .hex-icon{font-size:clamp(1.1rem,2.2vw,1.6rem);line-height:1;text-align:center;color:#333;}
    .hex-label{font-family:'Josefin Sans',sans-serif;font-size:clamp(0.35rem,0.7vw,0.55rem);letter-spacing:0.05em;text-transform:uppercase;font-weight:600;color:#333;text-align:center;line-height:1.2;width:70%;margin:0 auto;}
    .hex-btn.coming .hex-label{color:rgba(51,51,51,0.3);}

    .mini-footer{width:100%;border-top:0.5px solid rgba(255,255,255,0.2);padding:1rem 0;margin-top:2rem;}
    .mini-footer-inner{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:center;width:100%;max-width:1200px;margin:0 auto;padding:0 2rem;gap:1rem;color:#fff;}
    .mini-footer-links a{font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;color:#fff;opacity:0.7;padding:0 0.7rem;border-right:1px solid rgba(255,255,255,0.3);line-height:1;transition:opacity 0.2s;}
    .mini-footer-links a:last-child{border-right:none;}
    .mini-footer-mid{font-size:0.62rem;letter-spacing:0.12em;text-transform:uppercase;color:#fff;opacity:0.6;}
    .mini-footer-copy{font-size:0.62rem;letter-spacing:0.08em;color:#fff;opacity:0.6;text-align:right;}
  </style>
</head>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="hexGradSilver" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#e8e8e8"/><stop offset="100%" stop-color="#9e9e9e"/>
    </radialGradient>
    <radialGradient id="hexGradDimSilver" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#666666"/><stop offset="100%" stop-color="#333333"/>
    </radialGradient>
    <filter id="neonGlowGold">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonGlowGoldDim">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
