<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trä — ELEGANT-M</title>
  <meta name="description" content="Personliga lasergravyrer på trä. Unika detaljer för hemmet. ELEGANT-M."/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Josefin+Sans:wght@200;300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    /* Trä-tema: Varma bruna och beige toner */
    body{background:linear-gradient(160deg,#d2b48c 0%,#deb887 30%,#bc8f8f 60%,#8b4513 100%);min-height:100vh;font-family:'Josefin Sans',sans-serif;overflow-x:hidden;}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,0.2) 0.5px,transparent 0.5px);background-size:28px 28px;animation:glitterShift 6s ease-in-out infinite alternate;}
    @keyframes glitterShift{0%{opacity:0.3}50%{opacity:0.7}100%{opacity:0.3}}

    .top-bar{position:relative;z-index:10;width:100%;max-width:1200px;margin:0 auto;padding:1.8rem 2.5rem 0;display:flex;align-items:center;justify-content:space-between;}
    .back-link{font-size:0.72rem;letter-spacing:0.25em;text-transform:uppercase;text-decoration:none;color:#3e2723;opacity:0.8;display:flex;align-items:center;gap:0.5rem;transition:opacity 0.2s;}
    .back-link:hover{opacity:1;}
    .back-link::before{content:'←';font-size:1rem;}
    .site-name{font-family:'Cormorant Garamond',serif;font-size:clamp(1.3rem,2.5vw,1.9rem);font-weight:300;letter-spacing:0.18em;background:linear-gradient(135deg,#3e2723 0%,#5d4037 50%,#3e2723 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;white-space:nowrap;}
    .site-name span{font-style:italic;}
    .top-spacer{width:100px;}

    .page-title{position:relative;z-index:10;text-align:center;padding:2rem 1rem 0.5rem;}
    .page-title h1{font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,8vw,6rem);font-weight:300;letter-spacing:0.15em;background:linear-gradient(135deg,#3e2723 0%,#5d4037 50%,#3e2723 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .page-title p{font-size:clamp(0.7rem,1.3vw,0.85rem);letter-spacing:0.28em;text-transform:uppercase;color:#3e2723;opacity:0.7;margin-top:0.5rem;}
    .title-line{width:120px;height:0.5px;margin:1.2rem auto 0;background:linear-gradient(90deg,transparent,#3e2723,transparent);}

    .btn-container{position:relative;z-index:10;width:min(98vw,1200px);aspect-ratio:980/920;margin:0 auto;}
    .hex-btn{position:absolute;transform:translate(-50%,-50%);width:min(15vw,145px);height:min(15vw,145px);cursor:pointer;transition:transform 0.25s;display:block;text-decoration:none;}
    .hex-btn.coming{cursor:default;}
    .hex-btn.active:hover{transform:translate(-50%,-50%) scale(1.08);}
    .hex-btn svg{width:100%;height:100%;overflow:visible;}
    .hex-fill{fill:url(#hexGrad);}
    .hex-btn.coming .hex-fill{fill:url(#hexGradDim);opacity:0.6;}
    .hex-stroke{fill:none;stroke:#fffaf0;stroke-width:1.8;stroke-linejoin:round;animation:neonStroke 2.5s ease-in-out infinite alternate;filter:url(#neonGlow);}
    @keyframes neonStroke{0%{stroke-opacity:0.75;stroke-width:1.4;}100%{stroke-opacity:1.0;stroke-width:2.2;}}
    .hex-icon{font-size:clamp(1.1rem,2.2vw,1.6rem);line-height:1;filter:drop-shadow(0 0 4px rgba(255,255,255,0.3));text-align:center;}
    
    .hex-label{
      font-family:'Josefin Sans',sans-serif;
      font-size:clamp(0.32rem,0.7vw,0.52rem);
      letter-spacing:0.05em;
      text-transform:uppercase;
      font-weight:600;
      background:linear-gradient(135deg,#fff,#f5f5dc,#d2b48c,#deb887,#a0522d);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      text-align:center;
      line-height:1.2;
      width:60%;
      margin:0 auto;
    }
  </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="hexGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#5d4037"/><stop offset="50%" stop-color="#3e2723"/><stop offset="100%" stop-color="#2a1b1a"/>
    </radialGradient>
    <radialGradient id="hexGradDim" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4e342e"/><stop offset="100%" stop-color="#2a1b1a"/>
    </radialGradient>
  </defs>
</svg>

<div class="top-bar">
  <a class="back-link" href="index.html">Tillbaka</a>
  <a class="site-name" href="index.html">ELEGANT<span>-M</span></a>
  <div class="top-spacer"></div>
</div>

<div class="page-title">
  <h1>Trä</h1>
  <p>Naturlig lasergravyr — för en tidlös känsla</p>
  <div class="title-line"></div>
</div>

<div class="btn-container">
  <!-- Exempel på knapp -->
  <a class="hex-btn active" style="left:50%;top:30%;" href="#">
    <svg viewBox="0 0 100 100">
      <polygon class="hex-fill" points="50,2 98,26 98,74 50,98 2,74 2,26"/>
      <polygon class="hex-stroke" points="50,2 98,26 98,74 50,98 2,74 2,26"/>
      <foreignObject x="0" y="0" width="100" height="100">
        <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 6px;">
          <div class="hex-icon">🪵</div>
          <div class="hex-label">Graverad Bräda</div>
        </div>
      </foreignObject>
    </svg>
  </a>
</div>

</body>
</html>
